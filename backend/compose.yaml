# Base: what is shared by every environment.
# Dev extras live in compose.override.yml (loaded automatically).
# Prod: docker compose -f compose.yml -f compose.prod.yaml up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ makes the container's shell expand the variable, not Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

